# Nombre de la aplicacion
spring.application.name=club-manager

# Variables locales desde backend/.env (si existe)
spring.config.import=optional:file:.env[.properties]

# Configuracion del servidor
server.port=8080

# Configuracion de la base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/club_manager_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Configuracion de Swagger/OpenAPI (SpringDoc)
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui

# Configuracion de zona horaria
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# JWT (clave en Base64)
jwt.secret=${JWT_SECRET}

# Cookie de sesión
app.cookie.domain=${COOKIE_DOMAIN:}
app.cookie.secure=${COOKIE_SECURE:false}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
